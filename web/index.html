<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DaCode — a code editor that never stalls on your keystroke</title>
    <meta
      name="description"
      content="A code editor in Rust, drawn straight onto the GPU. Nothing unbounded ever runs on the UI thread, so a keystroke costs the same in a 100,000-line file as in a ten-line one."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!--
      The finished app icon from packaging/linux/icons/hicolor: the ض mark on its
      own dark tile, so it reads on a light browser chrome and a dark one alike.
      Relative, because `base` is "./".
    -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="DaCode" />
    <meta
      property="og:description"
      content="A code editor that never stalls on your keystroke. Rust, wgpu, tree-sitter, LSP — Vim's grammar if you want it, a conventional editor if you don't."
    />

    <!--
      No font links. The one face, Fira Code, is the editor's own bundled copy,
      declared with @font-face in src/styles.css and emitted by Vite as an asset.
    -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
