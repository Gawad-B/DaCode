<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DaCode — a code editor that never stalls on your keystroke</title>
    <meta
      name="description"
      content="A code editor in Rust, drawn straight onto the GPU. Nothing unbounded ever runs on the UI thread, so a keystroke costs the same in a 100,000-line file as in a ten-line one."
    />
    <meta name="theme-color" content="#1c1a18" />

    <!--
      The icon is the logo from logo/dacode/, set by src/main.tsx: Vite resolves
      an import from outside web/ but not a <link> here, and the logo is one file
      in the repository, not two.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="DaCode" />
    <meta
      property="og:description"
      content="A code editor that never stalls on your keystroke. Rust, wgpu, tree-sitter, LSP — Vim's grammar if you want it, a conventional editor if you don't."
    />

    <!--
      No font links. The one face, Fira Code, is the editor's own bundled copy,
      declared with @font-face in src/styles.css and emitted by Vite as an asset.
    -->

    <!--
      The theme is resolved before the first paint. A landing page for an editor
      whose own rule is "set the window background before the first frame" must
      not itself flash white on the way in.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dacode-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
