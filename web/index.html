<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dacode — a code editor that never stalls on your keystroke</title>
    <meta
      name="description"
      content="A code editor in Rust, drawn straight onto the GPU. Nothing unbounded ever runs on the UI thread, so a keystroke costs the same in a 100,000-line file as in a ten-line one."
    />
    <meta name="theme-color" content="#1c1a18" />

    <!-- The mark switches on the browser chrome's theme from inside the file. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="dacode" />
    <meta
      property="og:description"
      content="A code editor that never stalls on your keystroke. Rust, wgpu, tree-sitter, LSP — Vim's grammar if you want it, a conventional editor if you don't."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      The theme is resolved before the first paint. A landing page for an editor
      whose own rule is "set the window background before the first frame" must
      not itself flash white on the way in.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dacode-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
