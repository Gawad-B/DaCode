[package]
name = "vex-render"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPU rendering for the vex editor: rectangles and shaped text"

[dependencies]
vex-theme = { path = "../vex-theme" }

wgpu.workspace = true
glyphon.workspace = true
# The font database is built here rather than letting cosmic-text scan for us, so the bundled faces
# load first and the design renders on the first frame.
fontdb = "0.23"
winit.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
pollster.workspace = true
png.workspace = true
