[package]
name = "dacode"
version = "1.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "dacode — a modal code editor"

[lib]
name = "dacode"
path = "src/lib.rs"

[[bin]]
name = "dacode"
path = "src/main.rs"

[dependencies]
dacode-text.workspace = true
dacode-theme.workspace = true
dacode-render.workspace = true
dacode-buffer.workspace = true
dacode-display.workspace = true
dacode-input.workspace = true
dacode-syntax.workspace = true
dacode-import.workspace = true
dacode-project.workspace = true
dacode-lsp.workspace = true
dacode-lua.workspace = true
# By path: the workspace's dependency table is in the root manifest, and this crate is new.
dacode-terminal = { path = "../dacode-terminal" }
serde_json.workspace = true

winit.workspace = true
arboard.workspace = true
# For decoding the embedded window icon; already here for the offscreen capture.
png.workspace = true
anyhow.workspace = true
# The viewer. Pure Rust, each of them, so a PDF or a photo opens on any machine with no system
# library to install: `image` for the raster formats, `resvg` for SVG, `hayro` for PDF pages.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "0.45", default-features = false }
hayro = "0.8"
# Office documents are zip files of XML; their text is read out of them.
zip.workspace = true
# Formatters and language servers downloaded on demand (`tools.rs`): `.gz` and `.tar.gz` releases,
# unpacked in-process so the paths inside an archive are checked rather than trusted to a `tar`.
flate2 = "1"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
criterion.workspace = true
lsp-types.workspace = true
proptest.workspace = true

[[bench]]
name = "editor"
harness = false
