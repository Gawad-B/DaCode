[package]
name = "vex"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "vex — a modal code editor"

[lib]
name = "vex"
path = "src/lib.rs"

[[bin]]
name = "vex"
path = "src/main.rs"

[dependencies]
vex-text.workspace = true
vex-theme.workspace = true
vex-render.workspace = true
vex-buffer.workspace = true
vex-display.workspace = true
vex-input.workspace = true
vex-syntax.workspace = true
vex-import.workspace = true
vex-project.workspace = true
vex-lsp.workspace = true
vex-lua.workspace = true
serde_json.workspace = true

winit.workspace = true
arboard.workspace = true
# For decoding the embedded window icon; already here for the offscreen capture.
png.workspace = true
anyhow.workspace = true

[dev-dependencies]
criterion.workspace = true
lsp-types.workspace = true

[[bench]]
name = "editor"
harness = false
