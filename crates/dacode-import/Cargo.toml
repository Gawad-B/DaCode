[package]
name = "dacode-import"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Import VSCode settings, keybindings, themes and snippets into dacode"

[dependencies]
dacode-theme.workspace = true
dacode-input.workspace = true

serde_json.workspace = true
zip.workspace = true
anyhow.workspace = true

[dev-dependencies]
# ZipWriter, to build a sample .vsix in tests rather than committing a binary fixture.
zip = { workspace = true, features = ["deflate"] }
