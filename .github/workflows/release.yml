# Publishes a release from a tag.
#
# `build.yml` proves a commit works; this turns one into something people can install. It exists
# because the artifacts cannot all be built on one machine — the .deb, .rpm and tarball need Linux,
# and the installer needs a Windows box with a C toolchain for tree-sitter and Lua. Doing that by hand
# is how a release ends up carrying a Windows binary from a different commit than its Linux one.
#
# Tag and push, and this does the rest:
#
#     git tag -a v0.1.1 -m "dacode 0.1.1" && git push origin v0.1.1
#
# Nothing is published unless both builds *and both test suites* pass, so a bad tag fails loudly
# rather than shipping.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.1"
        required: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libwayland-dev libxkbcommon-dev
      - run: rustup component add rust-analyzer
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --release
      - name: Package
        run: |
          packaging/build-deb.sh
          packaging/build-rpm.sh
          packaging/build-tarball.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/packages/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: rustup component add rust-analyzer
      - run: cargo test --workspace --no-fail-fast
      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          packaging\windows\build-installer.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/packages/dacode-setup.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksum every asset
        # What the editor's updater checks a download against before it will install it
        # (`crates/dacode/src/update.rs`). Over every file the release carries, by bare name — the
        # updater looks an asset up by the name GitHub gives it. A release without this file is one
        # the updater refuses to install by itself, so it is made here rather than by hand.
        run: |
          set -eu
          mkdir -p sums
          for file in artifacts/*/*; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" ) >> sums/SHA256SUMS
          done
          cat sums/SHA256SUMS
      - name: Write the release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          # What changed, if the release wrote it down. `packaging/notes/<version>.md` is where that
          # goes, and this reads it rather than the commit log: a release page is read by someone
          # deciding whether to upgrade, and a list of commit subjects does not answer that.
          #
          # It comes first, and it is a *file* because this step used to build the notes from a
          # heredoc alone — so publishing 0.4.0 overwrote the hand-written notes that had been put on
          # the release minutes earlier, and nobody noticed until the next release was being cut.
          : > notes.md
          if [ -f "packaging/notes/${version}.md" ]; then
            cat "packaging/notes/${version}.md" >> notes.md
            printf '\n---\n\n' >> notes.md
          fi
          # The install instructions belong to the release, not to the commit log: someone reading a
          # release page wants the command for their platform, not a list of what changed in it.
          cat >> notes.md <<NOTES
          ## Install

          **Windows**

          Run \`dacode-setup.exe\`. It installs per-user under \`%LOCALAPPDATA%\Programs\dacode\` — no
          administrator rights, no UAC prompt — and adds a Start Menu entry, \`dacode\` on your \`PATH\`,
          "Open with dacode" on a folder's right-click menu, and an uninstaller.

          **Debian, Ubuntu, Mint**

          \`\`\`sh
          sudo apt install ./dacode_${version}_amd64.deb
          \`\`\`

          **Fedora, RHEL, openSUSE**

          \`\`\`sh
          sudo dnf install ./dacode-${version}-1.x86_64.rpm
          \`\`\`

          **Any Linux, no package manager**

          \`\`\`sh
          tar xzf dacode-${version}-x86_64-linux.tar.gz
          ./dacode-${version}-x86_64-linux/install.sh        # into ~/.local, no root needed
          \`\`\`

          A language server (\`rust-analyzer\`, \`pyright-langserver\`, …) and \`git\` are found on
          \`PATH\` if they are there; neither is needed to start.
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          # Created if it is not there, updated if it is, so re-running a failed publish is safe.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "dacode ${TAG#v}" --notes-file notes.md
            gh release upload "$TAG" artifacts/*/* sums/SHA256SUMS --clobber
          else
            gh release create "$TAG" --title "dacode ${TAG#v}" --notes-file notes.md artifacts/*/* sums/SHA256SUMS
          fi
