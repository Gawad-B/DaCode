# Builds the installable artifacts: dacode-setup.exe, a .deb, an .rpm, and DaCode.app as a .dmg.
#
# The Windows and macOS jobs exist because neither build can be verified from a Linux machine — the
# crates needing a C toolchain (tree-sitter, Lua) cannot even be type-checked without one. This is
# where that happens, so a broken Windows or Mac build is caught by a push rather than by a user.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without this every run recompiles nine tree-sitter grammars and Lua from C, which is most of
      # the fifteen minutes each Windows round trip was costing.
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libwayland-dev libxkbcommon-dev
      # The live language-server tests skip without it. Installed so they actually run here, which is
      # the point of having them — a runner where they always skip verifies nothing.
      - run: rustup component add rust-analyzer
      - run: cargo test --workspace --no-fail-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release
      # Renders each overlay offscreen and keeps the PNGs. The project's rule is that visual work is
      # verified by looking at a render, not by reading the drawing code — that rule has caught a
      # transparent popup, tofu glyphs and a 2px misalignment. Doing it here means it also applies to
      # whoever cannot run a GPU locally. Software rendering, since a runner has no display.
      - name: Render the interface
        continue-on-error: true
        env:
          DACODE_NO_SYSTEM_FONTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: vulkan
        run: |
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p target/shots
          file=crates/dacode/src/execute.rs
          for view in help-panel menu context-menu commands tree settings; do
            ./target/release/dacode --$view --screenshot target/shots/$view.png $file || true
          done
          ./target/release/dacode --which-key '<c-w>' --screenshot target/shots/which-key.png $file || true
          # The same panel for the other grammar: it must show conventional keys, not Vim's, and
          # that difference is the whole point of the change.
          ./target/release/dacode --help-panel --no-vim --screenshot target/shots/help-no-vim.png $file || true
          ./target/release/dacode --commands --no-vim --screenshot target/shots/commands-no-vim.png $file || true
          ./target/release/dacode --screenshot target/shots/plain.png $file || true
          ./target/release/dacode --empty --screenshot target/shots/empty.png || true
          ls -l target/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: target/shots/*
      - name: Package
        run: |
          packaging/build-deb.sh
          packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: target/packages/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The whole point of this job: everything the Linux machine cannot check.
      - run: cargo build --release
      - run: rustup component add rust-analyzer
      - run: cargo test --workspace --no-fail-fast
      # Clippy runs here as well as on Linux, because the two disagree: code inside `#[cfg(unix)]` is
      # not linted on Windows and code that is only *used* there produces warnings that only Windows
      # sees. A `mut` that Linux needed and Windows did not sat in `main.rs` for months because of it.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # What a Windows user should be downloading is an installer. The bare dacode.exe went out as the
      # release artifact and behaved exactly as it looks — it opened the editor instead of installing
      # it. Inno Setup is on the runner image; installed here if that ever stops being true.
      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          packaging\windows\build-installer.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: dacode-windows
          path: |
            target/packages/dacode-setup.exe
            target/release/dacode.exe

  macos:
    # Apple Silicon. The Intel half of the universal binary is cross-compiled on it by
    # build-app.sh, which Apple's toolchain does natively; the tests run on arm64 only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rust-analyzer
      - run: cargo test --workspace --no-fail-fast
      # As on Windows: code behind `cfg(target_os = "macos")` is linted nowhere else.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dacode-macos
          path: target/packages/dacode-*-macos.*
