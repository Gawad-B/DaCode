name: Bug report
description: Something dacode does that it should not.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. The single most useful thing you can give is a way to make it
        happen again — a file, a config, a sequence of keys. If it is something you can see, a
        `--screenshot` render is worth more than any description of it.

        If this is a security problem, please do not file it here. Report it privately at
        https://github.com/Gawad-B/Vex/security/advisories/new instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What dacode did, in as much detail as you can stand.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Numbered, from a fresh start if you can. Say which keys you pressed and what was on screen.
        `DACODE_CONFIG_DIR=/tmp/vexcfg dacode` starts against a throwaway config, which is the quickest way
        to find out whether your own `init.lua` is involved.
      placeholder: |
        1. dacode some/file.rs
        2. Press ctrl-e to open the file tree
        3. Click the third file
        4. The wrong file opens
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Which dacode
      description: >
        `dacode --version`. If you built it from source, the commit as well —
        `git rev-parse --short HEAD` — since a release number does not say which `main` you are on.
      placeholder: "dacode 0.4.1, built from source at 6d962ad"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: >
        Include the display server on Linux — Wayland and X11 differ for the window, the mouse and
        the clipboard. On Windows, the build number if you have it.
      placeholder: "Fedora 41, Wayland — or Windows 11 26100"
    validations:
      required: true

  - type: dropdown
    id: vim-keys
    attributes:
      label: Are Vim keys on?
      description: >
        First row of the settings panel (`ctrl-,`), or `vim_keys` in `init.lua`. The two grammars are
        separate code paths, so this decides which one the report is about.
      options:
        - "Yes — modal editing"
        - "No — conventional keys"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: A render, if it is visual
      description: >
        dacode draws itself offscreen and exits, so you can capture the exact state without a screen
        grab. Run it and drag the PNG in here. Add the flag for whatever was on screen — `--settings`,
        `--tree`, `--menu`, `--palette QUERY`, `--complete PREFIX` — and `--size WxH` if the window
        size is part of the problem.
      placeholder: |
        DACODE_NO_SYSTEM_FONTS=1 dacode --screenshot /tmp/dacode.png --tree path/to/file.rs

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >
        Your `init.lua` if it is not the default, which language server was running, the text of any
        message dacode printed. For a language-server problem, `DACODE_LSP_TRACE=1` logs every message in
        both directions — the last few before it went wrong are usually the whole story.
